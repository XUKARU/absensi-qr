<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Absensi Karyawan</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    #hasil {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }

    .normal {
      background: #f1f3f4;
      color: #333;
    }

    .success {
      background: #e6f4ea;
      color: #188038;
    }

    .error {
      background: #fce8e6;
      color: #d93025;
    }

    .info {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>
    📷 ABSENSI KARYAWAN
  </h2>

  <div id="reader"></div>

  <div id="hasil"
       class="normal">

    Mencari kamera belakang...

  </div>

  <div class="info">

    Arahkan kamera belakang ke QR perusahaan.

    <br>

    QR perusahaan:

    <b>COMPANY-ABSEN</b>

  </div>

</div>


<script>

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";

let scanner = null;

let sudahScan = false;


// ==================================================
// HASIL SCAN
// ==================================================

function onScanSuccess(decodedText) {

  if (sudahScan) {
    return;
  }

  const token =
    String(decodedText).trim();


  console.log(
    "QR terbaca:",
    token
  );


  // ==================================================
  // QR VALID
  // ==================================================

  if (
    token === TOKEN_PERUSAHAAN
  ) {

    sudahScan = true;


    const hasil =
      document.getElementById("hasil");


    hasil.className =
      "success";


    hasil.innerHTML =
      "✅ <b>QR PERUSAHAAN VALID</b>" +
      "<br><br>" +
      "Token: " +
      token;


    // Hentikan scanner
    if (scanner) {

      scanner.stop()
        .then(function() {

          console.log(
            "Scanner berhasil dihentikan."
          );

          return scanner.clear();

        })
        .catch(function(error) {

          console.log(
            "Scanner sudah berhenti:",
            error
          );

        });

    }


  } else {


    const hasil =
      document.getElementById("hasil");


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ <b>QR TIDAK VALID</b>" +
      "<br><br>" +
      "Isi QR: " +
      token;


    // Bisa scan lagi
    setTimeout(function() {

      hasil.className =
        "normal";

      hasil.innerHTML =
        "Arahkan kamera ke QR perusahaan.";

    }, 2000);

  }

}


// ==================================================
// ERROR SCAN
// ==================================================

function onScanFailure(errorMessage) {

  // Tidak ditampilkan
  // karena fungsi ini berjalan terus
  // selama kamera mencari QR.

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {

  const hasil =
    document.getElementById("hasil");


  try {

    hasil.className =
      "normal";

    hasil.innerHTML =
      "📷 Meminta izin kamera...";


    // ==================================================
    // MINTA IZIN KAMERA SEKALI
    // ==================================================

    await navigator.mediaDevices
      .getUserMedia({
        video: true,
        audio: false
      });


    // ==================================================
    // CARI KAMERA
    // ==================================================

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    console.log(
      "Kamera tersedia:",
      cameras
    );


    // ==================================================
    // CARI KAMERA BELAKANG
    // ==================================================

    let kameraBelakang =
      cameras.find(function(camera) {

        const nama =
          String(camera.label)
            .toLowerCase();


        return (

          nama.includes("back") ||

          nama.includes("rear") ||

          nama.includes("environment") ||

          nama.includes("belakang")

        );

      });


    // ==================================================
    // JIKA LABEL TIDAK TERSEDIA
    // GUNAKAN KAMERA TERAKHIR
    // ==================================================

    if (!kameraBelakang) {

      kameraBelakang =
        cameras[cameras.length - 1];

    }


    console.log(
      "Kamera dipilih:",
      kameraBelakang.label
    );


    // ==================================================
    // BUAT SCANNER
    // ==================================================

    scanner =
      new Html5Qrcode("reader");


    // ==================================================
    // MULAI SCANNER
    // ==================================================

    await scanner.start(

      kameraBelakang.id,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 <b>Kamera belakang aktif</b>" +
      "<br>" +
      "Arahkan kamera ke QR perusahaan.";


  }

  catch (error) {

    console.error(
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Kamera tidak dapat digunakan." +
      "<br><br>" +
      error.message;

  }

}


// ==================================================
// JALANKAN SAAT HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);

</script>


</body>

</html>
