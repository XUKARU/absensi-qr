<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Absensi Karyawan</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    #hasil {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      line-height: 1.6;
    }

    .normal {
      background: #f1f3f4;
      color: #333;
    }

    .success {
      background: #e6f4ea;
      color: #188038;
    }

    .error {
      background: #fce8e6;
      color: #d93025;
    }

    .member {
      background: #e8f0fe;
      color: #174ea6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📋 ABSENSI KARYAWAN
  </h2>


  <!-- =========================================
       REGISTRASI MEMBER
       ========================================= -->

  <div id="registrasi">


    <p>
      HP ini belum terdaftar sebagai Member.
    </p>


    <input
      type="text"
      id="idKaryawan"
      placeholder="ID Karyawan"
      autocomplete="off"
    >


    <input
      type="text"
      id="namaKaryawan"
      placeholder="Nama Karyawan"
      autocomplete="off"
    >


    <button
      id="btnDaftar"
      onclick="daftarMember()"
    >

      DAFTAR MEMBER

    </button>


  </div>


  <!-- =========================================
       MEMBER AKTIF
       ========================================= -->

  <div
    id="member"
    class="hidden"
  >

    <div class="member">

      👤 <b>MEMBER AKTIF</b>

      <br><br>

      <span id="namaMember"></span>

    </div>


    <div id="reader"></div>


    <div
      id="hasil"
      class="normal"
    >

      Mencari kamera belakang...

    </div>


    <p>
      Arahkan kamera belakang ke QR perusahaan.
    </p>

  </div>


</div>


<script>


// ==================================================
// VARIABEL
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


let memberToken =
  localStorage.getItem(
    "memberToken"
  );


let scanner = null;

let sudahScan = false;


// ==================================================
// SAAT HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER DI HP
// ==================================================

function cekMember() {

  if (
    memberToken
  ) {

    // HP sudah menjadi member
    tampilkanMember();

  } else {

    // HP belum menjadi member
    document
      .getElementById("registrasi")
      .classList.remove("hidden");

  }

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

function daftarMember() {

  const id =
    document
      .getElementById("idKaryawan")
      .value
      .trim();


  const nama =
    document
      .getElementById("namaKaryawan")
      .value
      .trim();


  const tombol =
    document
      .getElementById("btnDaftar");


  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  tombol.disabled =
    true;

  tombol.innerText =
    "MEMPROSES...";


  google.script.run

    .withSuccessHandler(
      function(result) {


        if (
          result.sukses
        ) {


          // =====================================
          // SIMPAN MEMBER TOKEN DI HP
          // =====================================

          localStorage.setItem(
            "memberToken",
            result.memberToken
          );


          localStorage.setItem(
            "memberNama",
            result.nama
          );


          localStorage.setItem(
            "memberID",
            result.id
          );


          memberToken =
            result.memberToken;


          alert(
            "✅ " +
            result.pesan
          );


          tampilkanMember();


        } else {


          alert(
            "❌ " +
            result.pesan
          );


          tombol.disabled =
            false;


          tombol.innerText =
            "DAFTAR MEMBER";

        }

      }
    )

    .withFailureHandler(
      function(error) {


        console.error(
          error
        );


        alert(
          "❌ Terjadi kesalahan."
        );


        tombol.disabled =
          false;


        tombol.innerText =
          "DAFTAR MEMBER";

      }
    )

    .registrasiMember(
      id,
      nama
    );

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {


  document
    .getElementById("registrasi")
    .classList.add("hidden");


  document
    .getElementById("member")
    .classList.remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById("namaMember")
    .innerText =
    nama || "Member";


  // Mulai scanner

  mulaiScanner();

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {


  const hasil =
    document
      .getElementById("hasil");


  try {


    hasil.innerHTML =
      "📷 Meminta izin kamera...";


    await navigator.mediaDevices
      .getUserMedia({

        video: true,

        audio: false

      });


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    // ==========================================
    // CARI KAMERA BELAKANG
    // ==========================================

    let kameraBelakang =
      cameras.find(
        function(camera) {

          const nama =
            String(
              camera.label
            ).toLowerCase();


          return (

            nama.includes("back") ||

            nama.includes("rear") ||

            nama.includes("environment") ||

            nama.includes("belakang")

          );

        }
      );


    // Jika tidak ditemukan,
    // gunakan kamera terakhir

    if (
      !kameraBelakang
    ) {

      kameraBelakang =
        cameras[
          cameras.length - 1
        ];

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      kameraBelakang.id,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      function(error) {}

    );


    hasil.innerHTML =
      "📷 <b>Kamera belakang aktif</b>" +
      "<br>" +
      "Arahkan ke QR perusahaan.";


  }

  catch(error) {


    console.error(
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Kamera tidak dapat digunakan." +
      "<br><br>" +
      error.message;

  }

}


// ==================================================
// HASIL SCAN QR
// ==================================================

function onScanSuccess(
  decodedText
) {


  if (
    sudahScan
  ) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  if (
    token !==
    TOKEN_PERUSAHAAN
  ) {

    document
      .getElementById("hasil")
      .className =
      "error";


    document
      .getElementById("hasil")
      .innerHTML =
      "❌ QR bukan QR perusahaan.";


    return;

  }


  // ==========================================
  // QR PERUSAHAAN VALID
  // ==========================================

  sudahScan =
    true;


  const hasil =
    document
      .getElementById("hasil");


  hasil.className =
    "success";


  hasil.innerHTML =
    "✅ <b>QR PERUSAHAAN VALID</b>" +
    "<br><br>" +
    "Member: " +
    localStorage.getItem(
      "memberNama"
    );


  // Hentikan scanner

  if (scanner) {

    scanner.stop()
      .then(
        function() {

          console.log(
            "Scanner dihentikan."
          );

        }
      )
      .catch(
        function(error) {

          console.log(
            error
          );

        }
      );

  }


  // ==========================================
  // TAHAP SELANJUTNYA
  // ==========================================

  console.log(
    "Member Token:",
    memberToken
  );

}


</script>


</body>

</html>
