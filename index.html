<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Absensi Karyawan</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .box {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h2 {
      margin-top: 0;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #hasil {
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.6;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>📷 ABSENSI KARYAWAN</h2>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <button id="btnKamera"
          onclick="mulaiKamera()">

    MULAI KAMERA

  </button>

  <div id="hasil">

    Tekan MULAI KAMERA

  </div>

</div>


<script>

let stream = null;
let scanning = false;

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN-2026";


// ========================================
// MULAI KAMERA
// ========================================

async function mulaiKamera() {

  const hasil =
    document.getElementById("hasil");

  const tombol =
    document.getElementById("btnKamera");


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    scanning =
      true;


    tombol.disabled =
      true;


    hasil.innerHTML =
      "📷 Kamera aktif.<br>" +
      "Arahkan kamera ke QR perusahaan.";


    // Untuk tahap pertama kita
    // belum membaca QR dulu.

  }

  catch (error) {

    console.error(error);


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Kamera tidak dapat digunakan.<br>" +
      error.message;


    tombol.disabled =
      false;

  }

}

</script>

</body>

</html>
