<script>


// ==================================================
// URL WEB APP APPS SCRIPT
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx6Ity9X5m1f5T2Zr5gV8yrJHiXH_eEdu7ItutnyfYzAAKV0boJ40QBSwPiS5-vrXSNMg/exec";


// ==================================================
// QR PERUSAHAAN
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


// ==================================================
// MEMBER TOKEN
// ==================================================

let memberToken =
  localStorage.getItem(
    "memberToken"
  );


// ==================================================
// DEVICE ID
// ==================================================

let deviceId =
  localStorage.getItem(
    "deviceId"
  );


if (!deviceId) {

  deviceId =
    "DEV-" +
    crypto.randomUUID()
      .replace(/-/g, "")
      .substring(0, 16)
      .toUpperCase();


  localStorage.setItem(
    "deviceId",
    deviceId
  );

}


// ==================================================
// SCANNER
// ==================================================

let scanner = null;


// ==================================================
// STATUS SCAN
// ==================================================

let sudahScan = false;


// ==================================================
// STATUS MENUNGGU ALASAN
// ==================================================

let sedangPulangCepat = false;


// ==================================================
// HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER
// ==================================================

function cekMember() {

  if (memberToken) {

    tampilkanMember();

  } else {

    document
      .getElementById("registrasi")
      .classList.remove("hidden");

  }

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

async function daftarMember() {


  const id =
    document
      .getElementById(
        "idKaryawan"
      )
      .value
      .trim();


  const nama =
    document
      .getElementById(
        "namaKaryawan"
      )
      .value
      .trim();


  const tombol =
    document
      .getElementById(
        "btnDaftar"
      );


  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  tombol.disabled =
    true;


  tombol.innerText =
    "MEMPROSES...";


  try {


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "registrasiMember",

              id:
                id,

              nama:
                nama,

              deviceId:
                deviceId

            })

        }
      );


    const result =
      await response.json();


    console.log(
      "HASIL REGISTRASI:",
      result
    );


    if (
      result &&
      result.sukses
    ) {


      localStorage.setItem(
        "memberToken",
        result.memberToken
      );


      localStorage.setItem(
        "memberNama",
        result.nama
      );


      localStorage.setItem(
        "memberID",
        result.id
      );


      memberToken =
        result.memberToken;


      alert(
        "✅ " +
        result.pesan
      );


      tampilkanMember();


    } else {


      alert(
        "❌ " +
        (
          result &&
          result.pesan
            ? result.pesan
            : "Registrasi gagal."
        )
      );


      tombol.disabled =
        false;


      tombol.innerText =
        "DAFTAR MEMBER";

    }


  } catch (error) {


    console.error(
      "ERROR REGISTRASI:",
      error
    );


    alert(
      "❌ Tidak dapat terhubung ke server absensi."
    );


    tombol.disabled =
      false;


    tombol.innerText =
      "DAFTAR MEMBER";

  }

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {


  document
    .getElementById("registrasi")
    .classList.add("hidden");


  document
    .getElementById("member")
    .classList.remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById(
      "namaMember"
    )
    .innerText =
    nama || "Member";


  mulaiScanner();

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {


  const hasil =
    document.getElementById(
      "hasil"
    );


  try {


    sudahScan =
      false;


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 Membuka kamera belakang...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        // Abaikan error scan sementara

      }

    );


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 <b>Kamera belakang aktif</b>" +
      "<br><br>" +
      "Arahkan kamera ke QR perusahaan.";


  } catch (error) {


    console.error(
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Kamera tidak dapat digunakan." +
      "<br><br>" +
      error.message;

  }

}


// ==================================================
// QR TERBACA
// ==================================================

function onScanSuccess(
  decodedText
) {


  if (sudahScan) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  console.log(
    "QR:",
    token
  );


  // ================================================
  // QR SALAH
  // ================================================

  if (
    token !==
    TOKEN_PERUSAHAAN
  ) {


    const hasil =
      document.getElementById(
        "hasil"
      );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ QR bukan QR perusahaan.";


    return;

  }


  // ================================================
  // QR BENAR
  // ================================================

  sudahScan =
    true;


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "success";


  hasil.innerHTML =
    "✅ <b>QR PERUSAHAAN VALID</b>" +
    "<br><br>" +
    "Member: " +
    localStorage.getItem(
      "memberNama"
    );


  // ================================================
  // STOP KAMERA
  // ================================================

  if (scanner) {


    scanner.stop()

      .then(
        function() {


          scanner.clear()
            .catch(
              function() {}
            );


          ambilGPSDanAbsen();

        }
      )

      .catch(
        function(error) {


          console.log(
            error
          );


          ambilGPSDanAbsen();

        }
      );


  } else {


    ambilGPSDanAbsen();

  }

}


// ==================================================
// GPS + ABSENSI
// ==================================================

function ambilGPSDanAbsen() {


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =
    "📍 Mengambil lokasi GPS...";


  if (
    !navigator.geolocation
  ) {


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Browser tidak mendukung GPS.";


    sudahScan =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      hasil.innerHTML =
        "📍 GPS berhasil." +
        "<br>" +
        "⏳ Memproses absensi...";


      try {


        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  aksi:
                    "absensiMember",

                  memberToken:
                    memberToken,

                  deviceId:
                    deviceId,

                  latitude:
                    latitude,

                  longitude:
                    longitude

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL ABSENSI:",
          result
        );


        // ==========================================
        // BUTUH ALASAN PULANG
        // ==========================================

        if (
          result &&
          result.tipe ===
          "BUTUH_ALASAN_PULANG"
        ) {


          sedangPulangCepat =
            true;


          hasil.className =
            "error";


          hasil.innerHTML =
            "⚠️ <b>PULANG CEPAT</b>" +
            "<br><br>" +
            "Silakan pilih alasan pulang.";


          document
            .getElementById(
              "pilihanAlasan"
            )
            .style.display =
            "block";


          // Simpan koordinat untuk
          // konfirmasi berikutnya

          window.latitudePulang =
            latitude;


          window.longitudePulang =
            longitude;


          return;

        }


        // ==========================================
        // BERHASIL
        // ==========================================

        if (
          result &&
          result.sukses
        ) {


          tampilkanHasilBerhasil(
            result
          );


          return;

        }


        // ==========================================
        // GAGAL
        // ==========================================

        hasil.className =
          "error";


        hasil.innerHTML =
          "❌ " +
          (
            result &&
            result.pesan
              ? result.pesan
              : "Absensi gagal."
          );


        sudahScan =
          false;


        tampilkanTombolScanLagi();


      } catch(error) {


        console.error(
          "ERROR ABSENSI:",
          error
        );


        hasil.className =
          "error";


        hasil.innerHTML =
          "❌ Tidak dapat terhubung ke server absensi.";


        sudahScan =
          false;


        tampilkanTombolScanLagi();

      }

    },


    function(error) {


      hasil.className =
        "error";


      if (
        error.code === 1
      ) {

        hasil.innerHTML =
          "❌ Izin lokasi ditolak.<br>" +
          "Silakan izinkan GPS.";

      }

      else if (
        error.code === 2
      ) {

        hasil.innerHTML =
          "❌ Lokasi tidak tersedia.";

      }

      else if (
        error.code === 3
      ) {

        hasil.innerHTML =
          "❌ Pengambilan lokasi terlalu lama.";

      }

      else {

        hasil.innerHTML =
          "❌ GPS tidak dapat diperoleh.";

      }


      sudahScan =
        false;


      tampilkanTombolScanLagi();

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// KONFIRMASI PULANG CEPAT
// ==================================================

async function konfirmasiPulang() {


  const radio =
    document.querySelector(
      'input[name="alasanPulang"]:checked'
    );


  // ================================================
  // WAJIB PILIH
  // ================================================

  if (!radio) {


    const hasil =
      document.getElementById(
        "hasil"
      );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Silakan pilih alasan pulang cepat terlebih dahulu.";


    return;

  }


  const alasanPulang =
    radio.value;


  // ================================================
  // VALIDASI TOKEN
  // ================================================

  if (!memberToken) {


    tampilkanError(
      "❌ Member Token tidak ditemukan."
    );


    return;

  }


  // ================================================
  // VALIDASI GPS
  // ================================================

  if (
    window.latitudePulang === undefined ||
    window.longitudePulang === undefined
  ) {


    tampilkanError(
      "❌ Data GPS tidak tersedia. Silakan scan ulang."
    );


    return;

  }


  const btnKonfirmasi =
    document.getElementById(
      "btnKonfirmasi"
    );


  const btnBatal =
    document.getElementById(
      "btnBatal"
    );


  btnKonfirmasi.disabled =
    true;


  btnBatal.disabled =
    true;


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =
    "⏳ Menyimpan absensi pulang...";


  try {


    // ==============================================
    // KIRIM ALASAN KE APPS SCRIPT
    // ==============================================

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "absensiMember",

              memberToken:
                memberToken,

              deviceId:
                deviceId,

              latitude:
                window.latitudePulang,

              longitude:
                window.longitudePulang,

              alasanPulang:
                alasanPulang

            })

        }
      );


    const result =
      await response.json();


    console.log(
      "HASIL PULANG:",
      result
    );


    // ==============================================
    // BERHASIL
    // ==============================================

    if (
      result &&
      result.sukses
    ) {


      sedangPulangCepat =
        false;


      document
        .getElementById(
          "pilihanAlasan"
        )
        .style.display =
        "none";


      tampilkanHasilBerhasil(
        result,
        alasanPulang
      );


      return;

    }


    // ==============================================
    // MASIH MEMBUTUHKAN ALASAN
    // ==============================================

    if (
      result &&
      result.tipe ===
      "BUTUH_ALASAN_PULANG"
    ) {


      hasil.className =
        "error";


      hasil.innerHTML =
        "⚠️ Silakan pilih alasan pulang cepat.";


      btnKonfirmasi.disabled =
        false;


      btnBatal.disabled =
        false;


      return;

    }


    // ==============================================
    // GAGAL
    // ==============================================

    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ " +
      (
        result &&
        result.pesan
          ? result.pesan
          : "Absensi pulang gagal."
      );


    btnKonfirmasi.disabled =
      false;


    btnBatal.disabled =
      false;


  } catch(error) {


    console.error(
      "ERROR KONFIRMASI PULANG:",
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Tidak dapat terhubung ke server absensi.";


    btnKonfirmasi.disabled =
      false;


    btnBatal.disabled =
      false;

  }

}


// ==================================================
// BATAL PULANG
// ==================================================

function batalPulang() {


  document
    .getElementById(
      "pilihanAlasan"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "hasil"
    )
    .className =
    "normal";


  document
    .getElementById(
      "hasil"
    )
    .innerHTML =
    "ℹ️ Absensi pulang dibatalkan.";


  document
    .getElementById(
      "btnKonfirmasi"
    )
    .disabled =
    false;


  document
    .getElementById(
      "btnBatal"
    )
    .disabled =
    false;


  // Hapus pilihan radio

  const radio =
    document.querySelector(
      'input[name="alasanPulang"]:checked'
    );


  if (radio) {

    radio.checked =
      false;

  }


  sedangPulangCepat =
    false;


  // Tetap jangan langsung membuka kamera.
  // User harus menekan SCAN LAGI.

  tampilkanTombolScanLagi();

}


// ==================================================
// TAMPILKAN HASIL BERHASIL
// ==================================================

function tampilkanHasilBerhasil(
  result,
  alasanPulang = ""
) {


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "success";


  let html = "";


  if (
    result.tipe ===
    "MASUK"
  ) {


    html =

      "✅ <b>ABSEN MASUK BERHASIL</b>" +

      "<br><br>" +

      "Nama: " +
      (result.nama || "") +

      "<br>" +

      "Waktu: " +
      (result.waktu || "");


  }

  else if (
    result.tipe ===
    "KELUAR"
  ) {


    html =

      "✅ <b>ABSEN PULANG BERHASIL</b>" +

      "<br><br>" +

      "Nama: " +
      (result.nama || "") +

      "<br>" +

      "Waktu: " +
      (result.waktu || "");


    if (
      result.totalJam
    ) {

      html +=

        "<br>" +

        "Total: " +
        result.totalJam;

    }


    if (
      result.status
    ) {

      html +=

        "<br>" +

        "Status: " +
        result.status;

    }


    if (
      alasanPulang
    ) {

      html +=

        "<br>" +

        "Alasan: " +
        alasanPulang;

    }

  }

  else {


    html =

      "✅ <b>ABSENSI BERHASIL</b>" +

      "<br><br>" +

      "Nama: " +
      (result.nama || "") +

      "<br>" +

      "Waktu: " +
      (result.waktu || "");

  }


  hasil.innerHTML =
    html;


  sudahScan =
    true;


  document
    .getElementById(
      "btnScanLagi"
    )
    .style.display =
    "block";

}
