<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>COMPANY ABSEN</title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f2f4f7;

    }


    .container {

      width: 100%;

      max-width: 450px;

      margin: 20px auto;

      padding: 22px;

      background: white;

      border-radius: 15px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.12);

      text-align: center;

    }


    h2 {

      margin-top: 0;

      margin-bottom: 20px;

    }


    h3 {

      margin-top: 0;

    }


    input,
    textarea {

      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;

      font-family:
        Arial,
        sans-serif;

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #1a73e8;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #reader {

      width: 100%;

      max-width: 400px;

      margin: 20px auto 0;

    }


    #hasil {

      margin-top: 18px;

      padding: 12px;

      border-radius: 8px;

      font-weight: bold;

      line-height: 1.6;

      word-break: break-word;

    }


    .normal {

      background: #f1f3f4;

      color: #333;

    }


    .success {

      background: #e6f4ea;

      color: #188038;

    }


    .error {

      background: #fce8e6;

      color: #d93025;

    }


    .member {

      background: #e8f0fe;

      color: #174ea6;

      padding: 15px;

      border-radius: 10px;

      margin-bottom: 20px;

    }


    .hidden {

      display: none !important;

    }


    /* ==========================================
       FORM PULANG
       ========================================== */

    #formPulang {

      margin-top: 20px;

      padding: 18px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      background: #fafafa;

      text-align: left;

    }


    #formPulang h3 {

      margin-top: 0;

      margin-bottom: 15px;

      text-align: center;

      font-size: 18px;

    }


    .judulInput {

      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      font-size: 15px;

    }


    /* ==========================================
       PILIHAN ALASAN
       ========================================== */

    #bagianAlasan {

      margin-bottom: 15px;

    }


    .radio-option {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 10px;

      padding: 12px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      background: white;

      cursor: pointer;

      font-size: 15px;

    }


    .radio-option input {

      width: auto;

      margin: 0;

      padding: 0;

    }


    /* ==========================================
       INPUT HASIL
       ========================================== */

    #hasilPulang {

      min-height: 90px;

      margin-bottom: 12px;

    }


    #btnKonfirmasiPulang {

      background: #188038;

      margin-top: 5px;

    }


    #btnBatalPulang {

      background: #d93025;

      margin-top: 10px;

    }


    .info {

      padding: 10px;

      margin-bottom: 15px;

      background: #fff8e1;

      border-radius: 8px;

      color: #795548;

      font-size: 14px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📋 ABSENSI KARYAWAN
  </h2>


  <!-- =====================================
       STATUS GLOBAL
       ===================================== -->

  <div
    id="hasil"
    class="normal"
  >

    Menyiapkan aplikasi...

  </div>


  <!-- =====================================
       QR SCANNER GLOBAL
       ===================================== -->

  <!--
    PENTING:
    Reader berada di luar registrasi/member
    agar bisa dipakai untuk keduanya.
  -->

  <div id="reader"></div>


  <!-- =====================================
       REGISTRASI MEMBER
       ===================================== -->

  <div id="registrasi">

    <p>
      HP ini belum terdaftar sebagai Member.
    </p>


    <input
      type="text"
      id="idKaryawan"
      placeholder="ID Karyawan"
      autocomplete="off"
    >


    <input
      type="text"
      id="namaKaryawan"
      placeholder="Nama Karyawan"
      autocomplete="off"
    >


    <button
      type="button"
      id="btnDaftar"
      onclick="daftarMember()"
    >

      DAFTAR MEMBER

    </button>

  </div>


  <!-- =====================================
       MEMBER AKTIF
       ===================================== -->

  <div
    id="member"
    class="hidden"
  >


    <div class="member">

      👤 <b>MEMBER AKTIF</b>

      <br><br>

      <span id="namaMember"></span>

    </div>


    <p>
      Arahkan kamera belakang ke QR lokasi perusahaan.
    </p>


    <!-- =====================================
         FORM PULANG
         ===================================== -->

    <div
      id="formPulang"
      class="hidden"
    >


      <h3>
        📝 DATA ABSEN PULANG
      </h3>


      <div
        id="infoPulang"
        class="info"
      >

        Silakan lengkapi data absensi pulang.

      </div>


      <!-- =================================
           ALASAN PULANG CEPAT
           ================================= -->

      <div
        id="bagianAlasan"
        class="hidden"
      >

        <label class="judulInput">

          ⚠️ Alasan Pulang Cepat

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="alasanPulang"
            value="Sakit atau Izin"
          >

          <span>
            Sakit atau Izin
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="alasanPulang"
            value="Setor Hasil"
          >

          <span>
            Setor Hasil
          </span>

        </label>


      </div>


      <!-- =================================
           INPUT HASIL
           ================================= -->

      <label
        class="judulInput"
        for="hasilPulang"
      >

        📦 Input Hasil

      </label>


      <textarea
        id="hasilPulang"
        placeholder="Masukkan hasil pekerjaan..."
      ></textarea>


      <!-- =================================
           KONFIRMASI
           ================================= -->

      <button
        type="button"
        id="btnKonfirmasiPulang"
        onclick="konfirmasiPulang()"
      >

        ✅ KONFIRMASI ABSEN PULANG

      </button>


      <!-- =================================
           BATAL
           ================================= -->

      <button
        type="button"
        id="btnBatalPulang"
        onclick="batalPulang()"
      >

        ❌ BATAL

      </button>


    </div>


  </div>


</div>


<script>


// ==================================================
// URL WEB APP MASTER
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbzr_unQdxAZ0eQ_ReOf5hZXTYY-MMeZ5cE9dq1pI7bukRSea2edQUVWH_ELbIg3OTuQ/exec";


// ==================================================
// MEMBER TOKEN
// ==================================================

let memberToken =
  localStorage.getItem(
    "memberToken"
  ) || "";


// ==================================================
// DEVICE ID
// ==================================================

let deviceId =
  localStorage.getItem(
    "deviceId"
  );


if (!deviceId) {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    deviceId =
      "DEV-" +
      crypto.randomUUID()
        .replace(/-/g, "")
        .substring(0, 16)
        .toUpperCase();

  } else {

    deviceId =
      "DEV-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10)
        .toUpperCase();

  }


  localStorage.setItem(
    "deviceId",
    deviceId
  );

}


console.log(
  "MEMBER TOKEN:",
  memberToken
);

console.log(
  "DEVICE ID:",
  deviceId
);


// ==================================================
// SCANNER
// ==================================================

let scanner = null;

let sudahScan = false;

let idTempat = "";

let modeRegistrasi = false;


// ==================================================
// STATUS PULANG
// ==================================================

let sedangPulang = false;

let pulangCepat = false;


// ==================================================
// HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER
// ==================================================

function cekMember() {

  const hasil =
    document.getElementById(
      "hasil"
    );


  if (memberToken) {

    console.log(
      "Member token ditemukan."
    );


    tampilkanMember();

    return;

  }


  console.log(
    "Belum ada member token."
  );


  document
    .getElementById(
      "registrasi"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "member"
    )
    .classList
    .add("hidden");


  hasil.className =
    "normal";


  hasil.innerHTML =
    "HP ini belum terdaftar sebagai Member.";

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

function daftarMember() {

  const id =
    document
      .getElementById(
        "idKaryawan"
      )
      .value
      .trim();


  const nama =
    document
      .getElementById(
        "namaKaryawan"
      )
      .value
      .trim();


  const tombol =
    document
      .getElementById(
        "btnDaftar"
      );


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  if (!navigator.geolocation) {

    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Browser tidak mendukung GPS.";

    return;

  }


  idTempat =
    "";

  sudahScan =
    false;

  modeRegistrasi =
    true;


  tombol.disabled =
    true;


  tombol.innerText =
    "SCAN QR LOKASI...";


  hasil.className =
    "normal";


  hasil.innerHTML =

    "📷 <b>Scan QR lokasi perusahaan</b>" +

    "<br><br>" +

    "Arahkan kamera ke QR lokasi.";


  mulaiScanner()
    .catch(function(error) {

      console.error(
        "ERROR SCANNER REGISTRASI:",
        error
      );


      modeRegistrasi =
        false;


      sudahScan =
        false;


      tombol.disabled =
        false;


      tombol.innerText =
        "DAFTAR MEMBER";

    });

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {

  document
    .getElementById(
      "registrasi"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "member"
    )
    .classList
    .remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById(
      "namaMember"
    )
    .innerText =
    nama || "Member";


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "📷 <b>Menyiapkan kamera absensi...</b>";


  sudahScan =
    false;


  idTempat =
    "";


  modeRegistrasi =
    false;


  mulaiScanner()
    .catch(function(error) {

      console.error(
        "ERROR SCANNER MEMBER:",
        error
      );

    });

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {

  const hasil =
    document.getElementById(
      "hasil"
    );


  try {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {

        console.log(
          "Scanner sebelumnya tidak aktif."
        );

      }


      try {

        scanner.clear();

      } catch (e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    hasil.className =
      "normal";


    hasil.innerHTML =

      "📷 Membuka kamera belakang...";


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        // Error scanner diabaikan

      }

    );


    hasil.className =
      "normal";


    hasil.innerHTML =

      "📷 <b>Kamera belakang aktif</b>" +

      "<br><br>" +

      "Arahkan kamera ke QR lokasi perusahaan.";

  }


  catch (error) {

    console.error(
      "ERROR KAMERA:",
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =

      "❌ Kamera tidak dapat digunakan." +

      "<br><br>" +

      (
        error.message ||
        "Silakan periksa izin kamera."
      );

    throw error;

  }

}


// ==================================================
// QR TERBACA
// ==================================================

function onScanSuccess(
  decodedText
) {

  if (sudahScan) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  console.log(
    "QR LOKASI:",
    token
  );


  const hasil =
    document.getElementById(
      "hasil"
    );


  if (!token) {

    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ QR lokasi tidak valid.";


    return;

  }


  // ================================================
  // QR SEKARANG ADALAH ID TEMPAT
  // ================================================

  idTempat =
    token;


  sudahScan =
    true;


  console.log(
    "ID TEMPAT:",
    idTempat
  );


  console.log(
    "MODE REGISTRASI:",
    modeRegistrasi
  );


  const tombol =
    document.getElementById(
      "btnDaftar"
    );


  if (tombol) {

    tombol.innerText =
      "MEMPROSES...";

  }


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>QR LOKASI VALID</b>" +

    "<br><br>" +

    "Lokasi: " +

    escapeHtml(
      idTempat
    ) +

    "<br><br>" +

    "📍 Mengambil lokasi GPS...";


  // ================================================
  // HENTIKAN KAMERA
  // ================================================

  if (scanner) {

    scanner.stop()

      .then(function() {

        console.log(
          "Kamera berhasil dihentikan."
        );

      })

      .catch(function(error) {

        console.log(
          "Kamera gagal dihentikan:",
          error
        );

      });

  }


  // ================================================
  // LANJUT PROSES
  // ================================================

  setTimeout(function() {

    console.log(
      "LANJUT SETELAH QR - modeRegistrasi:",
      modeRegistrasi
    );


    if (modeRegistrasi) {

      console.log(
        "Memanggil ambilGPSDanRegistrasi()"
      );


      ambilGPSDanRegistrasi();


      return;

    }


    console.log(
      "Memanggil ambilGPSDanAbsen()"
    );


    ambilGPSDanAbsen();


  }, 300);

}


// ==================================================
// GPS REGISTRASI
// ==================================================

function ambilGPSDanRegistrasi() {

  const hasil =
    document.getElementById(
      "hasil"
    );


  const tombol =
    document.getElementById(
      "btnDaftar"
    );


  console.log(
    "=== MULAI GPS REGISTRASI ==="
  );


  console.log(
    "ID TEMPAT:",
    idTempat
  );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "📍 <b>Mengambil lokasi GPS...</b>" +

    "<br><br>" +

    "Mohon tunggu...";


  if (!navigator.geolocation) {

    tampilkanErrorGPS(
      "Browser tidak mendukung GPS."
    );


    resetRegistrasi();


    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      console.log(
        "GPS BERHASIL:",
        latitude,
        longitude
      );


      hasil.className =
        "info";


      hasil.innerHTML =

        "✅ <b>GPS BERHASIL</b>" +

        "<br><br>" +

        "Latitude: " +
        latitude +

        "<br>" +

        "Longitude: " +
        longitude +

        "<br><br>" +

        "🔄 Mengirim data ke MASTER...";


      fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "registrasiMember",

              id:
                document
                  .getElementById(
                    "idKaryawan"
                  )
                  .value
                  .trim(),

              nama:
                document
                  .getElementById(
                    "namaKaryawan"
                  )
                  .value
                  .trim(),

              deviceId:
                deviceId,

              idTempat:
                idTempat,

              latitude:
                latitude,

              longitude:
                longitude

            })

        }

      )

      .then(function(response) {

        return response.json();

      })

      .then(function(data) {

        console.log(
          "RESPON MASTER REGISTRASI:",
          data
        );


        if (
          data &&
          data.sukses
        ) {

          localStorage.setItem(
            "memberToken",
            data.memberToken
          );


          localStorage.setItem(
            "memberNama",
            data.nama
          );


          localStorage.setItem(
            "memberID",
            data.id
          );


          memberToken =
            data.memberToken;


          modeRegistrasi =
            false;


          sudahScan =
            false;


          if (tombol) {

            tombol.disabled =
              false;

            tombol.innerText =
              "DAFTAR MEMBER";

          }


          alert(
            data.pesan ||
            "Registrasi berhasil."
          );


          tampilkanMember();


          return;

        }


        tampilkanError(

          data &&
          data.pesan
            ? data.pesan
            : "Registrasi gagal."

        );


        resetRegistrasi();

      })


      .catch(function(error) {

        console.error(
          "ERROR FETCH MASTER:",
          error
        );


        tampilkanError(

          "❌ Gagal menghubungi MASTER." +

          "<br><br>" +

          escapeHtml(
            error.message ||
            String(error)
          )

        );


        resetRegistrasi();

      });

    },


    function(error) {

      console.error(
        "GPS REGISTRASI ERROR:",
        error.code,
        error.message
      );


      if (
        error.code === 1
      ) {

        tampilkanErrorGPS(
          "Izin lokasi ditolak. Silakan izinkan lokasi pada browser."
        );

      }

      else if (
        error.code === 2
      ) {

        tampilkanErrorGPS(
          "Lokasi tidak tersedia. Pastikan GPS/lokasi perangkat aktif."
        );

      }

      else if (
        error.code === 3
      ) {

        tampilkanErrorGPS(
          "GPS terlalu lama memberikan respons."
        );

      }

      else {

        tampilkanErrorGPS(
          "GPS tidak dapat diperoleh."
        );

      }


      resetRegistrasi();

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// RESET REGISTRASI
// ==================================================

function resetRegistrasi() {

  modeRegistrasi =
    false;


  sudahScan =
    false;


  idTempat =
    "";


  const tombol =
    document.getElementById(
      "btnDaftar"
    );


  if (tombol) {

    tombol.disabled =
      false;

    tombol.innerText =
      "DAFTAR MEMBER";

  }

}


// ==================================================
// GPS ABSENSI
// ==================================================

function ambilGPSDanAbsen() {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "📍 <b>Mengambil lokasi GPS...</b>" +

    "<br><br>" +

    "Mohon tunggu...";


  if (!memberToken) {

    tampilkanError(
      "❌ Member Token tidak ditemukan."
    );


    sudahScan =
      false;


    return;

  }


  if (!navigator.geolocation) {

    tampilkanErrorGPS(
      "Browser tidak mendukung GPS."
    );


    sudahScan =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      console.log(
        "GPS ABSENSI:",
        latitude,
        longitude
      );


      hasil.className =
        "info";


      hasil.innerHTML =

        "✅ GPS berhasil." +

        "<br><br>" +

        "🔄 Mengirim absensi ke MASTER...";


      fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "absensiMember",

              memberToken:
                memberToken,

              deviceId:
                deviceId,

              idTempat:
                idTempat,

              latitude:
                latitude,

              longitude:
                longitude,

              alasanPulang:
                "",

              hasil:
                ""

            })

        }

      )

      .then(function(response) {

        return response.json();

      })

      .then(function(data) {

        console.log(
          "RESPON MASTER ABSENSI:",
          data
        );


        if (
          data &&
          data.sukses
        ) {

          if (
            data.tipe ===
            "MASUK"
          ) {

            tampilkanSuksesMasuk(
              data
            );

            return;

          }


          if (
            data.tipe ===
            "PULANG"
          ) {

            tampilkanSuksesPulang(
              data
            );

            return;

          }

        }


        if (
          data &&
          data.tipe ===
          "BUTUH_HASIL"
        ) {

          tampilkanFormPulang(
            false
          );


          sudahScan =
            false;


          return;

        }


        if (
          data &&
          data.tipe ===
          "BUTUH_ALASAN_PULANG"
        ) {

          tampilkanFormPulang(
            true
          );


          sudahScan =
            false;


          return;

        }


        tampilkanError(

          data &&
          data.pesan
            ? data.pesan
            : "Absensi gagal."

        );


        sudahScan =
          false;

      })


      .catch(function(error) {

        console.error(
          "ERROR ABSENSI:",
          error
        );


        tampilkanError(

          "❌ Gagal menghubungi MASTER." +

          "<br><br>" +

          escapeHtml(
            error.message ||
            String(error)
          )

        );


        sudahScan =
          false;

      });

    },


    function(error) {

      console.error(
        "GPS ABSENSI ERROR:",
        error.code,
        error.message
      );


      if (
        error.code === 1
      ) {

        tampilkanErrorGPS(
          "Izin lokasi ditolak."
        );

      }

      else if (
        error.code === 2
      ) {

        tampilkanErrorGPS(
          "Lokasi tidak tersedia."
        );

      }

      else if (
        error.code === 3
      ) {

        tampilkanErrorGPS(
          "GPS terlalu lama memberikan respons."
        );

      }

      else {

        tampilkanErrorGPS(
          "GPS tidak dapat diperoleh."
        );

      }


      sudahScan =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// TAMPILKAN FORM PULANG
// ==================================================

function tampilkanFormPulang(
  isPulangCepat
) {

  sedangPulang =
    true;


  pulangCepat =
    isPulangCepat;


  const form =
    document.getElementById(
      "formPulang"
    );


  const bagianAlasan =
    document.getElementById(
      "bagianAlasan"
    );


  const info =
    document.getElementById(
      "infoPulang"
    );


  const hasil =
    document.getElementById(
      "hasil"
    );


  form.classList.remove(
    "hidden"
  );


  hasil.className =
    "normal";


  if (isPulangCepat) {

    bagianAlasan
      .classList
      .remove("hidden");


    info.innerHTML =

      "⚠️ <b>Anda melakukan pulang cepat.</b>" +

      "<br><br>" +

      "Silakan pilih alasan pulang cepat " +

      "dan isi hasil pekerjaan.";

  }

  else {

    bagianAlasan
      .classList
      .add("hidden");


    info.innerHTML =

      "ℹ️ <b>Absen pulang normal.</b>" +

      "<br><br>" +

      "Silakan isi hasil pekerjaan.";

  }


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  document
    .getElementById(
      "hasilPulang"
    )
    .focus();

}


// ==================================================
// KONFIRMASI PULANG
// ==================================================

function konfirmasiPulang() {

  const hasilInput =
    document.getElementById(
      "hasilPulang"
    );


  const hasil =
    hasilInput
      .value
      .trim();


  if (!hasil) {

    alert(
      "Input hasil wajib diisi."
    );


    hasilInput.focus();


    return;

  }


  let alasanPulang =
    "";


  if (pulangCepat) {

    const radio =
      document.querySelector(
        'input[name="alasanPulang"]:checked'
      );


    if (!radio) {

      alert(
        "Silakan pilih alasan pulang cepat."
      );


      return;

    }


    alasanPulang =
      radio.value;

  }


  const tombol =
    document.getElementById(
      "btnKonfirmasiPulang"
    );


  const tombolBatal =
    document.getElementById(
      "btnBatalPulang"
    );


  tombol.disabled =
    true;


  tombolBatal.disabled =
    true;


  const status =
    document.getElementById(
      "hasil"
    );


  status.className =
    "normal";


  status.innerHTML =

    "📍 <b>Mengambil lokasi GPS...</b>" +

    "<br><br>" +

    "Mohon tunggu...";


  if (!navigator.geolocation) {

    tampilkanErrorGPS(
      "Browser tidak mendukung GPS."
    );


    tombol.disabled =
      false;


    tombolBatal.disabled =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      status.innerHTML =

        "📍 GPS berhasil." +

        "<br><br>" +

        "🔄 Menyimpan absensi pulang...";


      fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "absensiMember",

              memberToken:
                memberToken,

              deviceId:
                deviceId,

              idTempat:
                idTempat,

              latitude:
                latitude,

              longitude:
                longitude,

              alasanPulang:
                alasanPulang,

              hasil:
                hasil

            })

        }

      )

      .then(function(response) {

        return response.json();

      })

      .then(function(data) {

        console.log(
          "RESPON PULANG:",
          data
        );


        if (
          data &&
          data.sukses
        ) {

          tampilkanSuksesPulang(
            data
          );


          return;

        }


        tampilkanError(

          data &&
          data.pesan
            ? data.pesan
            : "Absensi pulang gagal."

        );


        tombol.disabled =
          false;


        tombolBatal.disabled =
          false;

      })


      .catch(function(error) {

        console.error(
          "ERROR PULANG:",
          error
        );


        tampilkanError(

          "❌ Gagal menghubungi MASTER." +

          "<br><br>" +

          escapeHtml(
            error.message ||
            String(error)
          )

        );


        tombol.disabled =
          false;


        tombolBatal.disabled =
          false;

      });

    },


    function(error) {

      tampilkanErrorGPS(
        error
      );


      tombol.disabled =
        false;


      tombolBatal.disabled =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// SUKSES ABSEN MASUK
// ==================================================

function tampilkanSuksesMasuk(
  data
) {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>ABSEN MASUK BERHASIL</b>" +

    "<br><br>" +

    (
      data.pesan ||
      "Absensi masuk berhasil."
    );


  sudahScan =
    false;


  setTimeout(
    function() {

      mulaiScanner();

    },
    2000
  );

}


// ==================================================
// SUKSES ABSEN PULANG
// ==================================================

function tampilkanSuksesPulang(
  data
) {

  formPulangSelesai();


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>ABSEN PULANG BERHASIL</b>" +

    "<br><br>" +

    (
      data.pesan ||
      "Absensi pulang berhasil."
    );


  setTimeout(
    function() {

      location.reload();

    },
    5000
  );

}


// ==================================================
// FORM PULANG SELESAI
// ==================================================

function formPulangSelesai() {

  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  sedangPulang =
    false;

}


// ==================================================
// BATAL PULANG
// ==================================================

function batalPulang() {

  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  sedangPulang =
    false;


  pulangCepat =
    false;


  sudahScan =
    false;


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "📷 <b>Siap melakukan absensi.</b>" +

    "<br><br>" +

    "Arahkan kamera ke QR lokasi perusahaan.";


  mulaiScanner();

}


// ==================================================
// ERROR GPS
// ==================================================

function tampilkanErrorGPS(
  error
) {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "error";


  if (
    typeof error ===
    "string"
  ) {

    hasil.innerHTML =
      "❌ " +
      escapeHtml(error);


    return;

  }


  if (
    error &&
    error.code === 1
  ) {

    hasil.innerHTML =

      "❌ <b>Izin lokasi ditolak.</b>" +

      "<br><br>" +

      "Silakan izinkan akses lokasi " +

      "pada browser.";

  }


  else if (
    error &&
    error.code === 2
  ) {

    hasil.innerHTML =

      "❌ <b>Lokasi tidak tersedia.</b>" +

      "<br><br>" +

      "Pastikan GPS/lokasi perangkat aktif.";

  }


  else if (
    error &&
    error.code === 3
  ) {

    hasil.innerHTML =

      "⏱️ <b>GPS terlalu lama memberikan respons.</b>" +

      "<br><br>" +

      "Silakan coba lagi.";

  }


  else {

    hasil.innerHTML =

      "❌ GPS tidak dapat diperoleh.";

  }

}


// ==================================================
// ERROR UMUM
// ==================================================

function tampilkanError(
  pesan
) {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "error";


  hasil.innerHTML =
    String(pesan);

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text || "");


  return div.innerHTML;

}
