<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Absensi Karyawan</title>

  <!-- LIBRARY QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f2f4f7;
    }


    .container {

      width: 100%;
      max-width: 450px;

      margin: 20px auto;

      padding: 20px;

      background: white;

      border-radius: 15px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.12);

      text-align: center;
    }


    h2 {

      margin-top: 0;

      margin-bottom: 20px;
    }


    #reader {

      width: 100%;

      max-width: 400px;

      margin: auto;
    }


    #hasil {

      margin-top: 20px;

      padding: 12px;

      border-radius: 8px;

      font-size: 16px;

      font-weight: bold;

      line-height: 1.6;
    }


    .normal {

      background: #f1f3f4;

      color: #333;
    }


    .success {

      background: #e6f4ea;

      color: #188038;
    }


    .error {

      background: #fce8e6;

      color: #d93025;
    }


    .info {

      margin-top: 15px;

      font-size: 14px;

      color: #666;

      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>
    📷 ABSENSI KARYAWAN
  </h2>


  <div id="reader"></div>


  <div id="hasil"
       class="normal">

    Memulai kamera...

  </div>


  <div class="info">

    Arahkan kamera ke QR perusahaan.

    <br>

    QR perusahaan:

    <b>COMPANY-ABSEN</b>

  </div>

</div>


<script>


// ==================================================
// TOKEN QR PERUSAHAAN
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


let sudahBerhasil =
  false;


// ==================================================
// ELEMENT HASIL
// ==================================================

const hasil =
  document.getElementById("hasil");


// ==================================================
// KETIKA QR BERHASIL DIBACA
// ==================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  console.log(
    "QR terbaca:",
    decodedText
  );


  // Jangan proses berkali-kali
  if (sudahBerhasil) {

    return;

  }


  // Bersihkan hasil scan
  const token =
    String(decodedText).trim();


  // ==================================================
  // CEK TOKEN
  // ==================================================

  if (
    token ===
    TOKEN_PERUSAHAAN
  ) {


    sudahBerhasil =
      true;


    hasil.className =
      "success";


    hasil.innerHTML =

      "✅ <b>QR PERUSAHAAN VALID</b>" +

      "<br><br>" +

      "Token: " +

      token;


    console.log(
      "QR perusahaan valid."
    );


    // Hentikan scanner
    if (window.scanner) {

      window.scanner.clear()
        .catch(function(error) {

          console.log(
            "Scanner tidak dapat dihentikan:",
            error
          );

        });

    }


  } else {


    hasil.className =
      "error";


    hasil.innerHTML =

      "❌ <b>QR TIDAK VALID</b>" +

      "<br><br>" +

      "Isi QR:" +

      "<br>" +

      token;


    console.log(
      "QR bukan QR perusahaan:",
      token
    );

  }

}


// ==================================================
// KETIKA QR BELUM TERBACA
// ==================================================

function onScanFailure(
  errorMessage
) {

  // Jangan menampilkan error
  // karena fungsi ini dipanggil
  // berkali-kali selama scanning.

}


// ==================================================
// BUAT SCANNER
// ==================================================

window.addEventListener(
  "load",
  function() {


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 Kamera sedang dimulai...";


    window.scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          aspectRatio: 1.0,

          rememberLastUsedCamera: true,

          showTorchButtonIfSupported: true,

          showZoomSliderIfSupported: true,

          defaultCameraStartOptions: {

            facingMode:
              "environment"

          }

        },

        false

      );


    window.scanner.render(

      onScanSuccess,

      onScanFailure

    );


  }

);

</script>


</body>

</html>
