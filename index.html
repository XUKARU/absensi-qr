<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Absensi Karyawan</title>

  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .box {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h2 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #hasil {
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
      line-height: 1.6;
    }

    .success {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

  </style>

</head>

<body>

<div class="box">

  <h2>📷 ABSENSI KARYAWAN</h2>

  <div id="reader"></div>

  <div id="hasil">
    Arahkan kamera ke QR perusahaan.
  </div>

</div>


<script>

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";

let sudahScan = false;


// ========================================
// QR BERHASIL DIBACA
// ========================================

function qrBerhasil(decodedText, decodedResult) {

  if (sudahScan) {
    return;
  }

  sudahScan = true;

  console.log("QR:", decodedText);

  const hasil =
    document.getElementById("hasil");


  // ========================================
  // VALIDASI QR PERUSAHAAN
  // ========================================

  if (
    decodedText.trim() ===
    TOKEN_PERUSAHAAN
  ) {

    hasil.className =
      "success";

    hasil.innerHTML =
      "✅ QR PERUSAHAAN VALID" +
      "<br><br>" +
      "Token: " +
      decodedText;

  } else {

    hasil.className =
      "error";

    hasil.innerHTML =
      "❌ QR BUKAN QR PERUSAHAAN" +
      "<br><br>" +
      "Token terbaca: " +
      decodedText;

    setTimeout(function() {

      sudahScan = false;

    }, 2000);

  }

}


// ========================================
// ERROR SCAN
// ========================================

function qrError(errorMessage) {

  // Tidak perlu menampilkan error
  // setiap frame kamera.

}


// ========================================
// MULAI SCANNER
// ========================================

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]

    },

    false

  );


scanner.render(
  qrBerhasil,
  qrError
);

</script>

</body>

</html>
