<script>


// ==================================================
// URL WEB APP APPS SCRIPT
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx6Ity9X5m1f5T2Zr5gV8yrJHiXH_eEdu7ItutnyfYzAAKV0boJ40QBSwPiS5-vrXSNMg/exec";


// ==================================================
// QR PERUSAHAAN
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


// ==================================================
// MEMBER TOKEN
// ==================================================

let memberToken =
  localStorage.getItem(
    "memberToken"
  );


// ==================================================
// DEVICE ID
// ==================================================

let deviceId =
  localStorage.getItem(
    "deviceId"
  );

console.log("MEMBER TOKEN:", memberToken);
console.log("DEVICE ID:", deviceId);

if (!deviceId) {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    deviceId =
      "DEV-" +
      crypto.randomUUID()
        .replace(/-/g, "")
        .substring(0, 16)
        .toUpperCase();

  } else {

    deviceId =
      "DEV-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10)
        .toUpperCase();

  }


  localStorage.setItem(
    "deviceId",
    deviceId
  );

}


// ==================================================
// SCANNER
// ==================================================

let scanner = null;

let sudahScan = false;


// ==================================================
// STATUS PULANG
// ==================================================

let sedangPulang = false;

let pulangCepat = false;


// ==================================================
// HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER
// ==================================================

function cekMember() {

  if (memberToken) {

    tampilkanMember();

  } else {

    document
      .getElementById("registrasi")
      .classList
      .remove("hidden");

  }

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

async function daftarMember() {

  const id =
    document
      .getElementById("idKaryawan")
      .value
      .trim();


  const nama =
    document
      .getElementById("namaKaryawan")
      .value
      .trim();


  const tombol =
    document
      .getElementById("btnDaftar");


  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  tombol.disabled = true;

  tombol.innerText =
    "MEMPROSES...";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "registrasiMember",

              id:
                id,

              nama:
                nama,

              deviceId:
                deviceId

            })

        }
      );


    const result =
      await response.json();


    console.log(
      "HASIL REGISTRASI:",
      result
    );


    if (
      result &&
      result.sukses
    ) {

      localStorage.setItem(
        "memberToken",
        result.memberToken
      );


      localStorage.setItem(
        "memberNama",
        result.nama
      );


      localStorage.setItem(
        "memberID",
        result.id
      );


      memberToken =
        result.memberToken;


      alert(
        "✅ " +
        result.pesan
      );


      tampilkanMember();


    } else {

      alert(
        "❌ " +
        (
          result &&
          result.pesan
            ? result.pesan
            : "Registrasi gagal."
        )
      );


      tombol.disabled =
        false;


      tombol.innerText =
        "DAFTAR MEMBER";

    }


  } catch (error) {

    console.error(
      "ERROR REGISTRASI:",
      error
    );


    alert(
      "❌ Tidak dapat terhubung ke server absensi."
    );


    tombol.disabled =
      false;


    tombol.innerText =
      "DAFTAR MEMBER";

  }

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {

  document
    .getElementById("registrasi")
    .classList
    .add("hidden");


  document
    .getElementById("member")
    .classList
    .remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById("namaMember")
    .innerText =
    nama || "Member";


  mulaiScanner();

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {

  const hasil =
    document
      .getElementById("hasil");


  try {

    // Pastikan scanner lama dihentikan
    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {

        console.log(
          "Scanner sebelumnya tidak aktif."
        );

      }

      try {

        scanner.clear();

      } catch (e) {}

    }


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 Membuka kamera belakang...";


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        // Error scanner diabaikan

      }

    );


    hasil.className =
      "normal";


    hasil.innerHTML =

      "📷 <b>Kamera belakang aktif</b>" +

      "<br><br>" +

      "Arahkan kamera ke QR perusahaan.";


  } catch (error) {

    console.error(
      "ERROR KAMERA:",
      error
    );


    hasil.className =
      "error";


    hasil.innerHTML =

      "❌ Kamera tidak dapat digunakan." +

      "<br><br>" +

      (
        error.message ||
        "Silakan periksa izin kamera."
      );

  }

}


// ==================================================
// QR TERBACA
// ==================================================

function onScanSuccess(
  decodedText
) {

  if (sudahScan) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  console.log(
    "QR:",
    token
  );


  // ================================================
  // QR SALAH
  // ================================================

  if (
    token !==
    TOKEN_PERUSAHAAN
  ) {

    const hasil =
      document
        .getElementById("hasil");


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ QR bukan QR perusahaan.";


    return;

  }


  // ================================================
  // QR BENAR
  // ================================================

  sudahScan =
    true;


  const hasil =
    document
      .getElementById("hasil");


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>QR PERUSAHAAN VALID</b>" +

    "<br><br>" +

    "Member: " +

    (
      localStorage.getItem(
        "memberNama"
      ) ||
      "Member"
    );


  // ================================================
  // STOP KAMERA
  // ================================================

  if (scanner) {

    scanner.stop()

      .then(
        function() {

          try {

            scanner.clear();

          } catch (e) {}


          ambilGPSDanAbsen();

        }
      )

      .catch(
        function(error) {

          console.log(
            "Gagal stop scanner:",
            error
          );


          ambilGPSDanAbsen();

        }
      );


  } else {

    ambilGPSDanAbsen();

  }

}


// ==================================================
// GPS + ABSENSI
// ==================================================

function ambilGPSDanAbsen() {

  const hasil =
    document
      .getElementById("hasil");


  hasil.className =
    "normal";


  hasil.innerHTML =
    "📍 Mengambil lokasi GPS...";


  if (
    !navigator.geolocation
  ) {

    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Browser tidak mendukung GPS.";


    sudahScan =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      hasil.innerHTML =

        "📍 GPS berhasil." +

        "<br>" +

        "⏳ Memeriksa absensi...";


      try {

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  aksi:
                    "absensiMember",

                  memberToken:
                    memberToken,

                  deviceId:
                    deviceId,

                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  // =================================
                  // ABSEN MASUK
                  // =================================

                  alasanPulang:
                    "",

                  hasil:
                    ""

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL ABSENSI:",
          result
        );


        // ==========================================
        // BUTUH HASIL
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_HASIL"
        ) {

          tampilkanFormPulang(
            result.pulangCepat === true
          );

          return;

        }


        // ==========================================
        // BUTUH ALASAN PULANG
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_ALASAN_PULANG"
        ) {

          tampilkanFormPulang(
            true
          );

          return;

        }


        // ==========================================
        // ABSEN MASUK BERHASIL
        // ==========================================

        if (
          result &&
          result.status
        ) {

          if (
            result.tipe ===
            "MASUK"
          ) {

            tampilkanSuksesMasuk(
              result
            );

            return;

          }


          // ========================================
          // PULANG LANGSUNG
          // ========================================

          if (
            result.tipe ===
            "PULANG"
          ) {

            tampilkanSuksesPulang(
              result
            );

            return;

          }

        }


        // ==========================================
        // GAGAL
        // ==========================================

        hasil.className =
          "error";


        hasil.innerHTML =

          "❌ " +

          (
            result &&
            result.pesan
              ? result.pesan
              : "Absensi gagal."
          );


        sudahScan =
          false;


      } catch(error) {

        console.error(
          "ERROR ABSENSI:",
          error
        );


        hasil.className =
          "error";


        hasil.innerHTML =

          "❌ Tidak dapat terhubung ke server absensi.";


        sudahScan =
          false;

      }

    },


    function(error) {

      tampilkanErrorGPS(
        error
      );


      sudahScan =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// TAMPILKAN FORM PULANG
// ==================================================

function tampilkanFormPulang(
  isPulangCepat
) {

  sedangPulang =
    true;


  pulangCepat =
    isPulangCepat;


  const form =
    document
      .getElementById(
        "formPulang"
      );


  const bagianAlasan =
    document
      .getElementById(
        "bagianAlasan"
      );


  const info =
    document
      .getElementById(
        "infoPulang"
      );


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  form.classList.remove(
    "hidden"
  );


  hasil.className =
    "normal";


  if (isPulangCepat) {

    bagianAlasan
      .classList
      .remove("hidden");


    info.innerHTML =

      "⚠️ <b>Anda melakukan pulang cepat.</b>" +

      "<br><br>" +

      "Silakan pilih alasan pulang cepat " +

      "dan isi hasil pekerjaan.";


  } else {

    bagianAlasan
      .classList
      .add("hidden");


    info.innerHTML =

      "ℹ️ <b>Absen pulang normal.</b>" +

      "<br><br>" +

      "Silakan isi hasil pekerjaan.";

  }


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  document
    .getElementById(
      "hasilPulang"
    )
    .focus();

}


// ==================================================
// KONFIRMASI PULANG
// ==================================================

async function konfirmasiPulang() {

  const hasilInput =
    document
      .getElementById(
        "hasilPulang"
      );


  const hasil =
    hasilInput.value.trim();


  // ================================================
  // HASIL WAJIB
  // ================================================

  if (!hasil) {

    tampilkanError(

      "❌ Input hasil wajib diisi."

    );


    hasilInput.focus();


    return;

  }


  // ================================================
  // ALASAN
  // ================================================

  let alasanPulang =
    "";


  if (pulangCepat) {

    const radio =
      document.querySelector(
        'input[name="alasanPulang"]:checked'
      );


    if (!radio) {

      tampilkanError(

        "❌ Silakan pilih alasan pulang cepat terlebih dahulu."

      );


      return;

    }


    alasanPulang =
      radio.value;

  }


  // ================================================
  // MEMBER TOKEN
  // ================================================

  if (!memberToken) {

    tampilkanError(

      "❌ Member Token tidak ditemukan."

    );


    return;

  }


  // ================================================
  // TOMBOL
  // ================================================

  const tombol =
    document
      .getElementById(
        "btnKonfirmasiPulang"
      );


  const tombolBatal =
    document
      .getElementById(
        "btnBatalPulang"
      );


  tombol.disabled =
    true;


  tombolBatal.disabled =
    true;


  const hasilStatus =
    document
      .getElementById(
        "hasil"
      );


  hasilStatus.className =
    "normal";


  hasilStatus.innerHTML =

    "📍 Mengambil lokasi GPS...";


  // ================================================
  // GPS
  // ================================================

  if (
    !navigator.geolocation
  ) {

    tampilkanError(

      "❌ Browser tidak mendukung GPS."

    );


    tombol.disabled =
      false;


    tombolBatal.disabled =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      hasilStatus.innerHTML =

        "📍 GPS berhasil." +

        "<br>" +

        "⏳ Menyimpan absensi pulang...";


      try {

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  aksi:
                    "absensiMember",

                  memberToken:
                    memberToken,

                  deviceId:
                    deviceId,

                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  // =================================
                  // DATA PULANG
                  // =================================

                  alasanPulang:
                    alasanPulang,

                  hasil:
                    hasil

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL PULANG:",
          result
        );


        // ==========================================
        // BERHASIL
        // ==========================================

        if (
          result &&
          result.status &&
          result.tipe ===
            "PULANG"
        ) {

          tampilkanSuksesPulang(
            result
          );

          return;

        }


        // ==========================================
        // SERVER MASIH MEMBUTUHKAN ALASAN
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_ALASAN_PULANG"
        ) {

          tampilkanError(

            "❌ Silakan pilih alasan pulang cepat."

          );


          tombol.disabled =
            false;


          tombolBatal.disabled =
            false;


          return;

        }


        // ==========================================
        // SERVER MASIH MEMBUTUHKAN HASIL
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_HASIL"
        ) {

          tampilkanError(

            "❌ Input hasil wajib diisi."

          );


          tombol.disabled =
            false;


          tombolBatal.disabled =
            false;


          return;

        }


        // ==========================================
        // GAGAL
        // ==========================================

        hasilStatus.className =
          "error";


        hasilStatus.innerHTML =

          "❌ " +

          (
            result &&
            result.pesan
              ? result.pesan
              : "Absensi pulang gagal."
          );


        tombol.disabled =
          false;


        tombolBatal.disabled =
          false;


      } catch(error) {

        console.error(
          "ERROR SIMPAN PULANG:",
          error
        );


        hasilStatus.className =
          "error";


        hasilStatus.innerHTML =

          "❌ Tidak dapat terhubung ke server absensi.";


        tombol.disabled =
          false;


        tombolBatal.disabled =
          false;

      }

    },


    function(error) {

      const hasilStatus =
        document
          .getElementById(
            "hasil"
          );


      tampilkanErrorGPS(
        error
      );


      tombol.disabled =
        false;


      tombolBatal.disabled =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// SUKSES ABSEN MASUK
// ==================================================

function tampilkanSuksesMasuk(
  result
) {

  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>ABSEN MASUK BERHASIL</b>" +

    "<br><br>" +

    "Nama: " +

    (
      result.nama ||
      localStorage.getItem(
        "memberNama"
      ) ||
      "-"
    ) +

    "<br>" +

    "Tanggal: " +

    (
      result.tanggal ||
      "-"
    ) +

    "<br>" +

    "Jam Masuk: " +

    (
      result.jamMasuk ||
      "-"
    ) +

    "<br>" +

    "Jarak: " +

    (
      result.jarak !== undefined
        ? result.jarak + " meter"
        : "-"
    );


  setTimeout(
    function() {

      location.reload();

    },
    5000
  );

}


// ==================================================
// SUKSES ABSEN PULANG
// ==================================================

function tampilkanSuksesPulang(
  result
) {

  formPulangSelesai();


  const hasilStatus =
    document
      .getElementById(
        "hasil"
      );


  hasilStatus.className =
    "success";


  let html =

    "✅ <b>ABSEN PULANG BERHASIL</b>" +

    "<br><br>" +

    "Nama: " +

    (
      result.nama ||
      localStorage.getItem(
        "memberNama"
      ) ||
      "-"
    ) +

    "<br>" +

    "Tanggal: " +

    (
      result.tanggal ||
      "-"
    ) +

    "<br>" +

    "Jam Masuk: " +

    (
      result.jamMasuk ||
      "-"
    ) +

    "<br>" +

    "Jam Pulang: " +

    (
      result.jamKeluar ||
      "-"
    ) +

    "<br>" +

    "Total: " +

    (
      result.totalJam ||
      "-"
    ) +

    "<br>" +

    "Status: " +

    (
      result.statusAbsensi ||
      "-"
    );


  if (
    result.alasanPulang
  ) {

    html +=

      "<br>" +

      "Alasan: " +

      escapeHtml(
        result.alasanPulang
      );

  }


  if (
    result.hasil
  ) {

    html +=

      "<br>" +

      "Hasil: " +

      escapeHtml(
        result.hasil
      );

  }


  hasilStatus.innerHTML =
    html;


  setTimeout(
    function() {

      location.reload();

    },
    6000
  );

}


// ==================================================
// FORM PULANG SELESAI
// ==================================================

function formPulangSelesai() {

  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  sedangPulang =
    false;

}


// ==================================================
// BATAL PULANG
// ==================================================

function batalPulang() {

  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "ℹ️ Absensi pulang dibatalkan.";


  document
    .getElementById(
      "btnKonfirmasiPulang"
    )
    .disabled =
    false;


  document
    .getElementById(
      "btnBatalPulang"
    )
    .disabled =
    false;


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  sedangPulang =
    false;


  pulangCepat =
    false;


  // ================================================
  // SCAN ULANG
  // ================================================

  sudahScan =
    false;


  setTimeout(
    function() {

      mulaiScanner();

    },
    500
  );

}


// ==================================================
// ERROR GPS
// ==================================================

function tampilkanErrorGPS(
  error
) {

  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "error";


  if (
    error &&
    error.code === 1
  ) {

    hasil.innerHTML =

      "❌ <b>Izin lokasi ditolak.</b>" +

      "<br><br>" +

      "Silakan izinkan akses lokasi " +

      "pada browser.";

  }

  else if (
    error &&
    error.code === 2
  ) {

    hasil.innerHTML =

      "❌ Lokasi tidak tersedia.";

  }

  else if (
    error &&
    error.code === 3
  ) {

    hasil.innerHTML =

      "❌ Pengambilan lokasi terlalu lama.";

  }

  else {

    hasil.innerHTML =

      "❌ GPS tidak dapat diperoleh.";

  }

}


// ==================================================
// TAMPILKAN ERROR
// ==================================================

function tampilkanError(
  pesan
) {

  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "error";


  hasil.innerHTML =
    pesan;

}


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


// ==================================================
// SELESAI
// ==================================================

</script>
