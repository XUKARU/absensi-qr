<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>COMPANY ABSEN</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    #hasil {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      line-height: 1.6;
    }

    .normal {
      background: #f1f3f4;
      color: #333;
    }

    .success {
      background: #e6f4ea;
      color: #188038;
    }

    .error {
      background: #fce8e6;
      color: #d93025;
    }

    .member {
      background: #e8f0fe;
      color: #174ea6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">

  <h2>
    📋 ABSENSI KARYAWAN
  </h2>


  <!-- =====================================
       REGISTRASI MEMBER
       ===================================== -->

  <div id="registrasi">

    <p>
      HP ini belum terdaftar sebagai Member.
    </p>

    <input
      type="text"
      id="idKaryawan"
      placeholder="ID Karyawan"
      autocomplete="off"
    >

    <input
      type="text"
      id="namaKaryawan"
      placeholder="Nama Karyawan"
      autocomplete="off"
    >

    <button
      type="button"
      id="btnDaftar"
      onclick="daftarMember()"
    >
      DAFTAR MEMBER
    </button>

  </div>


  <!-- =====================================
       MEMBER AKTIF
       ===================================== -->

  <div
    id="member"
    class="hidden"
  >

    <div class="member">

      👤 <b>MEMBER AKTIF</b>

      <br><br>

      <span id="namaMember"></span>

    </div>


    <div id="reader"></div>


    <div
      id="hasil"
      class="normal"
    >
      Menyiapkan kamera...
    </div>


    <p>
      Arahkan kamera belakang ke QR perusahaan.
    </p>

  </div>

</div>


<script>


// ==================================================
// URL WEB APP APPS SCRIPT
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx6Ity9X5m1f5T2Zr5gV8yrJHiXH_eEdu7ItutnyfYzAAKV0boJ40QBSwPiS5-vrXSNMg/exec";


// ==================================================
// QR PERUSAHAAN
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


// ==================================================
// MEMBER TOKEN
// ==================================================

let memberToken =
  localStorage.getItem(
    "memberToken"
  );

  // ==================================================
// DEVICE ID
// ==================================================

let deviceId =
  localStorage.getItem("deviceId");

if (!deviceId) {

  deviceId =
    "DEV-" +
    crypto.randomUUID()
      .replace(/-/g, "")
      .substring(0, 16)
      .toUpperCase();

  localStorage.setItem(
    "deviceId",
    deviceId
  );
}

// ==================================================
// SCANNER
// ==================================================

let scanner = null;

let sudahScan = false;


// ==================================================
// HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER
// ==================================================

function cekMember() {

  if (memberToken) {

    tampilkanMember();

  } else {

    document
      .getElementById("registrasi")
      .classList.remove("hidden");

  }

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

async function daftarMember() {

  const id =
    document
      .getElementById("idKaryawan")
      .value
      .trim();


  const nama =
    document
      .getElementById("namaKaryawan")
      .value
      .trim();


  const tombol =
    document
      .getElementById("btnDaftar");


  // VALIDASI

  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  tombol.disabled =
    true;


  tombol.innerText =
    "MEMPROSES...";


  try {


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
  JSON.stringify({
    aksi: "registrasiMember",
    id: id,
    nama: nama,
    deviceId: deviceId
  })
        }
      );


    const result =
      await response.json();


    console.log(
      "HASIL REGISTRASI:",
      result
    );


    if (
      result &&
      result.sukses
    ) {


      // SIMPAN MEMBER TOKEN

      localStorage.setItem(
        "memberToken",
        result.memberToken
      );


      localStorage.setItem(
        "memberNama",
        result.nama
      );


      localStorage.setItem(
        "memberID",
        result.id
      );


      memberToken =
        result.memberToken;


      alert(
        "✅ " +
        result.pesan
      );


      tampilkanMember();


    } else {


      alert(
        "❌ " +
        (
          result &&
          result.pesan
            ? result.pesan
            : "Registrasi gagal."
        )
      );


      tombol.disabled =
        false;


      tombol.innerText =
        "DAFTAR MEMBER";

    }


  } catch (error) {


    console.error(
      "ERROR REGISTRASI:",
      error
    );


    alert(
      "❌ Tidak dapat terhubung ke server absensi."
    );


    tombol.disabled =
      false;


    tombol.innerText =
      "DAFTAR MEMBER";

  }

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {

  document
    .getElementById("registrasi")
    .classList.add("hidden");


  document
    .getElementById("member")
    .classList.remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById("namaMember")
    .innerText =
    nama || "Member";


  mulaiScanner();

}


// ==================================================
// MULAI SCANNER - KAMERA BELAKANG
// ==================================================

async function mulaiScanner() {

  const hasil =
    document.getElementById("hasil");

  try {

    hasil.className = "normal";

    hasil.innerHTML =
      "📷 Membuka kamera belakang...";


    // Buat scanner
    scanner =
      new Html5Qrcode("reader");


    // Konfigurasi QR
    const config = {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    // ==========================================
    // LANGSUNG PAKAI KAMERA BELAKANG
    // ==========================================

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {
        // Abaikan error scan sementara
      }

    );


    hasil.className = "normal";

    hasil.innerHTML =
      "📷 <b>Kamera belakang aktif</b>" +
      "<br><br>" +
      "Arahkan kamera ke QR perusahaan.";


  } catch (error) {

    console.error(error);

    hasil.className = "error";

    hasil.innerHTML =
      "❌ Kamera tidak dapat digunakan." +
      "<br><br>" +
      error.message;

  }

}

// ==================================================
// QR TERBACA
// ==================================================

function onScanSuccess(
  decodedText
) {


  if (sudahScan) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  console.log(
    "QR:",
    token
  );


  // QR SALAH

  if (
    token !==
    TOKEN_PERUSAHAAN
  ) {

    const hasil =
      document.getElementById(
        "hasil"
      );


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ QR bukan QR perusahaan.";


    return;

  }


  // QR BENAR

  sudahScan =
    true;


  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "success";


  hasil.innerHTML =
    "✅ <b>QR PERUSAHAAN VALID</b>" +
    "<br><br>" +
    "Member: " +
    localStorage.getItem(
      "memberNama"
    );


  // STOP KAMERA

  if (scanner) {

    scanner.stop()

      .then(
        function() {

          scanner.clear()
            .catch(
              function() {}
            );


          ambilGPSDanAbsen();

        }
      )

      .catch(
        function(error) {

          console.log(
            error
          );


          ambilGPSDanAbsen();

        }
      );

  } else {

    ambilGPSDanAbsen();

  }

}


// ==================================================
// GPS + ABSENSI
// ==================================================

function ambilGPSDanAbsen() {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.className =
    "normal";


  hasil.innerHTML =
    "📍 Mengambil lokasi GPS...";


  if (
    !navigator.geolocation
  ) {

    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Browser tidak mendukung GPS.";


    sudahScan =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      hasil.innerHTML =
        "📍 GPS berhasil." +
        "<br>" +
        "⏳ Menyimpan absensi...";


      try {


        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
  JSON.stringify({

    aksi:
      "absensiMember",

    memberToken:
      memberToken,

    deviceId:
      deviceId,

    latitude:
      latitude,

    longitude:
      longitude

  })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL ABSENSI:",
          result
        );


        if (
          result &&
          result.sukses
        ) {


          hasil.className =
            "success";


          // MASUK

          if (
            result.tipe ===
            "MASUK"
          ) {

            hasil.innerHTML =

              "✅ <b>ABSEN MASUK BERHASIL</b>" +

              "<br><br>" +

              "Nama: " +
              result.nama +

              "<br>" +

              "Waktu: " +
              result.waktu;

          }


          // KELUAR

          else if (
            result.tipe ===
            "KELUAR"
          ) {

            hasil.innerHTML =

              "✅ <b>ABSEN KELUAR BERHASIL</b>" +

              "<br><br>" +

              "Nama: " +
              result.nama +

              "<br>" +

              "Waktu: " +
              result.waktu +

              "<br>" +

              "Total: " +
              result.totalJam +

              "<br>" +

              "Status: " +
              result.status;

          }


          // RESET

          setTimeout(
            function() {

              location.reload();

            },
            5000
          );


        } else {


          hasil.className =
            "error";


          hasil.innerHTML =
            "❌ " +
            (
              result &&
              result.pesan
                ? result.pesan
                : "Absensi gagal."
            );


          sudahScan =
            false;

        }


      } catch(error) {


        console.error(
          "ERROR ABSENSI:",
          error
        );


        hasil.className =
          "error";


        hasil.innerHTML =
          "❌ Tidak dapat terhubung ke server absensi.";


        sudahScan =
          false;

      }

    },


    function(error) {


      hasil.className =
        "error";


      if (
        error.code === 1
      ) {

        hasil.innerHTML =
          "❌ Izin lokasi ditolak.<br>" +
          "Silakan izinkan GPS.";

      }

      else if (
        error.code === 2
      ) {

        hasil.innerHTML =
          "❌ Lokasi tidak tersedia.";

      }

      else if (
        error.code === 3
      ) {

        hasil.innerHTML =
          "❌ Pengambilan lokasi terlalu lama.";

      }

      else {

        hasil.innerHTML =
          "❌ GPS tidak dapat diperoleh.";

      }


      sudahScan =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}

</script>

</body>

</html>
