<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>COMPANY ABSEN</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f2f4f7;

    }


    .container {

      width: 100%;

      max-width: 450px;

      margin: 20px auto;

      padding: 22px;

      background: white;

      border-radius: 15px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.12);

      text-align: center;

    }


    h2 {

      margin-top: 0;

      margin-bottom: 20px;

    }


    input,
    textarea {

      width: 100%;

      padding: 14px;

      margin-bottom: 12px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;

      font-family: Arial, sans-serif;

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #1a73e8;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #reader {

      width: 100%;

      max-width: 400px;

      margin: auto;

    }


    #hasil {

      margin-top: 18px;

      padding: 12px;

      border-radius: 8px;

      font-weight: bold;

      line-height: 1.6;

    }


    .normal {

      background: #f1f3f4;

      color: #333;

    }


    .success {

      background: #e6f4ea;

      color: #188038;

    }


    .error {

      background: #fce8e6;

      color: #d93025;

    }


    .member {

      background: #e8f0fe;

      color: #174ea6;

      padding: 15px;

      border-radius: 10px;

      margin-bottom: 20px;

    }


    .hidden {

      display: none !important;

    }


    /* ==========================================
       FORM PULANG
       ========================================== */

    #formPulang {

      margin-top: 20px;

      padding: 18px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      background: #fafafa;

      text-align: left;

    }


    #formPulang h3 {

      margin-top: 0;

      margin-bottom: 15px;

      text-align: center;

      font-size: 18px;

    }


    .judulInput {

      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      font-size: 15px;

    }


    /* ==========================================
       PILIHAN ALASAN
       ========================================== */

    #bagianAlasan {

      margin-bottom: 15px;

    }


    .radio-option {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 10px;

      padding: 12px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      background: white;

      cursor: pointer;

      font-size: 15px;

    }


    .radio-option input {

      width: auto;

      margin: 0;

      padding: 0;

    }


    /* ==========================================
       INPUT HASIL
       ========================================== */

    #hasilPulang {

      min-height: 90px;

      margin-bottom: 12px;

    }


    #btnKonfirmasiPulang {

      background: #188038;

      margin-top: 5px;

    }


    #btnBatalPulang {

      background: #d93025;

      margin-top: 10px;

    }


    .info {

      padding: 10px;

      margin-bottom: 15px;

      background: #fff8e1;

      border-radius: 8px;

      color: #795548;

      font-size: 14px;

      line-height: 1.5;

    }


  </style>

</head>


<body>


<div class="container">


  <h2>
    📋 ABSENSI KARYAWAN
  </h2>


  <!-- =====================================
       REGISTRASI MEMBER
       ===================================== -->

  <div id="registrasi">


    <p>
      HP ini belum terdaftar sebagai Member.
    </p>


    <input
      type="text"
      id="idKaryawan"
      placeholder="ID Karyawan"
      autocomplete="off"
    >


    <input
      type="text"
      id="namaKaryawan"
      placeholder="Nama Karyawan"
      autocomplete="off"
    >


    <button
      type="button"
      id="btnDaftar"
      onclick="daftarMember()"
    >

      DAFTAR MEMBER

    </button>


  </div>


  <!-- =====================================
       MEMBER AKTIF
       ===================================== -->

  <div
    id="member"
    class="hidden"
  >


    <div class="member">

      👤 <b>MEMBER AKTIF</b>

      <br><br>

      <span id="namaMember"></span>

    </div>


    <!-- =====================================
         SCANNER QR
         ===================================== -->

    <div id="reader"></div>


    <!-- =====================================
         HASIL ABSENSI
         ===================================== -->

    <div
      id="hasil"
      class="normal"
    >

      Menyiapkan kamera...

    </div>


    <p>
      Arahkan kamera belakang ke QR perusahaan.
    </p>


    <!-- =====================================
         FORM PULANG
         ===================================== -->

    <div
      id="formPulang"
      class="hidden"
    >


      <h3>
        📝 DATA ABSEN PULANG
      </h3>


      <!-- =================================
           INFORMASI
           ================================= -->

      <div
        id="infoPulang"
        class="info"
      >

        Silakan lengkapi data absensi pulang.

      </div>


      <!-- =================================
           ALASAN PULANG CEPAT
           ================================= -->

      <div
        id="bagianAlasan"
        class="hidden"
      >

        <label class="judulInput">

          ⚠️ Alasan Pulang Cepat

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="alasanPulang"
            value="Sakit atau Izin"
          >

          <span>
            Sakit atau Izin
          </span>

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="alasanPulang"
            value="Setor Hasil"
          >

          <span>
            Setor Hasil
          </span>

        </label>


      </div>


      <!-- =================================
           INPUT HASIL
           ================================= -->

      <label
        class="judulInput"
        for="hasilPulang"
      >

        📦 Input Hasil

      </label>


      <textarea
        id="hasilPulang"
        placeholder="Masukkan hasil pekerjaan..."
      ></textarea>


      <!-- =================================
           KONFIRMASI
           ================================= -->

      <button
        type="button"
        id="btnKonfirmasiPulang"
        onclick="konfirmasiPulang()"
      >

        ✅ KONFIRMASI ABSEN PULANG

      </button>


      <!-- =================================
           BATAL
           ================================= -->

      <button
        type="button"
        id="btnBatalPulang"
        onclick="batalPulang()"
      >

        ❌ BATAL

      </button>


    </div>


  </div>


</div>


<script>


// ==================================================
// URL WEB APP APPS SCRIPT
// ==================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx6Ity9X5m1f5T2Zr5gV8yrJHiXH_eEdu7ItutnyfYzAAKV0boJ40QBSwPiS5-vrXSNMg/exec";


// ==================================================
// QR PERUSAHAAN
// ==================================================

const TOKEN_PERUSAHAAN =
  "COMPANY-ABSEN";


// ==================================================
// MEMBER TOKEN
// ==================================================

let memberToken =
  localStorage.getItem(
    "memberToken"
  );


// ==================================================
// DEVICE ID
// ==================================================

let deviceId =
  localStorage.getItem(
    "deviceId"
  );


if (!deviceId) {

  deviceId =
    "DEV-" +
    crypto.randomUUID()
      .replace(/-/g, "")
      .substring(0, 16)
      .toUpperCase();


  localStorage.setItem(
    "deviceId",
    deviceId
  );

}


// ==================================================
// SCANNER
// ==================================================

let scanner = null;

let sudahScan = false;


// ==================================================
// STATUS PULANG
// ==================================================

let sedangPulang = false;

let pulangCepat = false;


// ==================================================
// HALAMAN DIBUKA
// ==================================================

window.addEventListener(
  "load",
  function() {

    cekMember();

  }
);


// ==================================================
// CEK MEMBER
// ==================================================

function cekMember() {


  if (memberToken) {

    tampilkanMember();

  } else {

    document
      .getElementById("registrasi")
      .classList
      .remove("hidden");

  }

}


// ==================================================
// DAFTAR MEMBER
// ==================================================

async function daftarMember() {


  const id =
    document
      .getElementById("idKaryawan")
      .value
      .trim();


  const nama =
    document
      .getElementById("namaKaryawan")
      .value
      .trim();


  const tombol =
    document
      .getElementById("btnDaftar");


  if (!id) {

    alert(
      "ID Karyawan harus diisi."
    );

    return;

  }


  if (!nama) {

    alert(
      "Nama Karyawan harus diisi."
    );

    return;

  }


  tombol.disabled = true;

  tombol.innerText =
    "MEMPROSES...";


  try {


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              aksi:
                "registrasiMember",

              id:
                id,

              nama:
                nama,

              deviceId:
                deviceId

            })

        }
      );


    const result =
      await response.json();


    console.log(
      "HASIL REGISTRASI:",
      result
    );


    if (
      result &&
      result.sukses
    ) {


      localStorage.setItem(
        "memberToken",
        result.memberToken
      );


      localStorage.setItem(
        "memberNama",
        result.nama
      );


      localStorage.setItem(
        "memberID",
        result.id
      );


      memberToken =
        result.memberToken;


      alert(
        "✅ " +
        result.pesan
      );


      tampilkanMember();


    } else {


      alert(
        "❌ " +
        (
          result &&
          result.pesan
            ? result.pesan
            : "Registrasi gagal."
        )
      );


      tombol.disabled =
        false;


      tombol.innerText =
        "DAFTAR MEMBER";

    }


  } catch (error) {


    console.error(
      "ERROR REGISTRASI:",
      error
    );


    alert(
      "❌ Tidak dapat terhubung ke server absensi."
    );


    tombol.disabled =
      false;


    tombol.innerText =
      "DAFTAR MEMBER";

  }

}


// ==================================================
// TAMPILKAN MEMBER
// ==================================================

function tampilkanMember() {


  document
    .getElementById("registrasi")
    .classList
    .add("hidden");


  document
    .getElementById("member")
    .classList
    .remove("hidden");


  const nama =
    localStorage.getItem(
      "memberNama"
    );


  document
    .getElementById("namaMember")
    .innerText =
    nama || "Member";


  mulaiScanner();

}


// ==================================================
// MULAI SCANNER
// ==================================================

async function mulaiScanner() {


  const hasil =
    document
      .getElementById("hasil");


  try {


    hasil.className =
      "normal";


    hasil.innerHTML =
      "📷 Membuka kamera belakang...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        // Abaikan error scanner

      }

    );


    hasil.className =
      "normal";


    hasil.innerHTML =

      "📷 <b>Kamera belakang aktif</b>" +

      "<br><br>" +

      "Arahkan kamera ke QR perusahaan.";


  } catch (error) {


    console.error(error);


    hasil.className =
      "error";


    hasil.innerHTML =

      "❌ Kamera tidak dapat digunakan." +

      "<br><br>" +

      error.message;

  }

}


// ==================================================
// QR TERBACA
// ==================================================

function onScanSuccess(
  decodedText
) {


  if (sudahScan) {

    return;

  }


  const token =
    String(
      decodedText
    ).trim();


  console.log(
    "QR:",
    token
  );


  // ================================================
  // QR SALAH
  // ================================================

  if (
    token !==
    TOKEN_PERUSAHAAN
  ) {


    const hasil =
      document
        .getElementById("hasil");


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ QR bukan QR perusahaan.";


    return;

  }


  // ================================================
  // QR BENAR
  // ================================================

  sudahScan =
    true;


  const hasil =
    document
      .getElementById("hasil");


  hasil.className =
    "success";


  hasil.innerHTML =

    "✅ <b>QR PERUSAHAAN VALID</b>" +

    "<br><br>" +

    "Member: " +

    localStorage.getItem(
      "memberNama"
    );


  // ================================================
  // STOP KAMERA
  // ================================================

  if (scanner) {


    scanner.stop()

      .then(
        function() {


          scanner.clear()
            .catch(
              function() {}
            );


          ambilGPSDanAbsen();


        }
      )

      .catch(
        function(error) {


          console.log(error);


          ambilGPSDanAbsen();

        }
      );


  } else {

    ambilGPSDanAbsen();

  }

}


// ==================================================
// GPS + ABSENSI
// ==================================================

function ambilGPSDanAbsen() {


  const hasil =
    document
      .getElementById("hasil");


  hasil.className =
    "normal";


  hasil.innerHTML =
    "📍 Mengambil lokasi GPS...";


  if (
    !navigator.geolocation
  ) {


    hasil.className =
      "error";


    hasil.innerHTML =
      "❌ Browser tidak mendukung GPS.";


    sudahScan =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      hasil.innerHTML =

        "📍 GPS berhasil." +

        "<br>" +

        "⏳ Memeriksa absensi...";


      try {


        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  aksi:
                    "absensiMember",

                  memberToken:
                    memberToken,

                  deviceId:
                    deviceId,

                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  alasanPulang:
                    "",

                  hasilPulang:
                    ""

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL ABSENSI:",
          result
        );


        // ==========================================
        // BUTUH DATA PULANG
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_DATA_PULANG"
        ) {


          tampilkanFormPulang(
            result.pulangCepat === true
          );


          return;

        }


        // ==========================================
        // VERSI LAMA / BUTUH ALASAN
        // ==========================================

        if (
          result &&
          result.tipe ===
            "BUTUH_ALASAN_PULANG"
        ) {


          tampilkanFormPulang(
            true
          );


          return;

        }


        // ==========================================
        // BERHASIL
        // ==========================================

        if (
          result &&
          result.sukses
        ) {


          hasil.className =
            "success";


          if (
            result.tipe ===
            "MASUK"
          ) {


            hasil.innerHTML =

              "✅ <b>ABSEN MASUK BERHASIL</b>" +

              "<br><br>" +

              "Nama: " +

              result.nama +

              "<br>" +

              "Waktu: " +

              result.waktu;


          }


          else if (
            result.tipe ===
            "KELUAR"
          ) {


            hasil.innerHTML =

              "✅ <b>ABSEN KELUAR BERHASIL</b>" +

              "<br><br>" +

              "Nama: " +

              result.nama +

              "<br>" +

              "Waktu: " +

              result.waktu +

              "<br>" +

              "Total: " +

              (
                result.totalJam ||
                "-"
              ) +

              "<br>" +

              "Status: " +

              (
                result.status ||
                "-"
              );

          }


          setTimeout(
            function() {

              location.reload();

            },
            5000
          );


        }


        // ==========================================
        // GAGAL
        // ==========================================

        else {


          hasil.className =
            "error";


          hasil.innerHTML =

            "❌ " +

            (
              result &&
              result.pesan
                ? result.pesan
                : "Absensi gagal."
            );


          sudahScan =
            false;

        }


      } catch(error) {


        console.error(
          "ERROR ABSENSI:",
          error
        );


        hasil.className =
          "error";


        hasil.innerHTML =

          "❌ Tidak dapat terhubung ke server absensi.";


        sudahScan =
          false;

      }

    },


    function(error) {


      hasil.className =
        "error";


      if (
        error.code === 1
      ) {


        hasil.innerHTML =

          "❌ Izin lokasi ditolak." +

          "<br>" +

          "Silakan izinkan GPS.";

      }


      else if (
        error.code === 2
      ) {


        hasil.innerHTML =
          "❌ Lokasi tidak tersedia.";

      }


      else if (
        error.code === 3
      ) {


        hasil.innerHTML =

          "❌ Pengambilan lokasi terlalu lama.";

      }


      else {


        hasil.innerHTML =
          "❌ GPS tidak dapat diperoleh.";

      }


      sudahScan =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// TAMPILKAN FORM PULANG
// ==================================================

function tampilkanFormPulang(
  isPulangCepat
) {


  sedangPulang =
    true;


  pulangCepat =
    isPulangCepat;


  const form =
    document
      .getElementById(
        "formPulang"
      );


  const bagianAlasan =
    document
      .getElementById(
        "bagianAlasan"
      );


  const info =
    document
      .getElementById(
        "infoPulang"
      );


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  form.classList.remove(
    "hidden"
  );


  hasil.className =
    "normal";


  if (isPulangCepat) {


    bagianAlasan
      .classList
      .remove("hidden");


    info.innerHTML =

      "⚠️ <b>Anda melakukan pulang cepat.</b>" +

      "<br><br>" +

      "Silakan pilih alasan pulang cepat " +

      "dan isi hasil pekerjaan.";


  } else {


    bagianAlasan
      .classList
      .add("hidden");


    info.innerHTML =

      "ℹ️ <b>Absen pulang normal.</b>" +

      "<br><br>" +

      "Silakan isi hasil pekerjaan.";


  }


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  document
    .getElementById(
      "hasilPulang"
    )
    .focus();

}


// ==================================================
// KONFIRMASI PULANG
// ==================================================

async function konfirmasiPulang() {


  const hasilInput =
    document
      .getElementById(
        "hasilPulang"
      );


  const hasilPulang =
    hasilInput.value.trim();


  // ================================================
  // HASIL WAJIB DIISI
  // ================================================

  if (!hasilPulang) {


    tampilkanError(

      "❌ Input hasil wajib diisi."

    );


    hasilInput.focus();


    return;

  }


  // ================================================
  // ALASAN JIKA PULANG CEPAT
  // ================================================

  let alasanPulang = "";


  if (pulangCepat) {


    const radio =
      document.querySelector(
        'input[name="alasanPulang"]:checked'
      );


    if (!radio) {


      tampilkanError(

        "❌ Silakan pilih alasan pulang cepat terlebih dahulu."

      );


      return;

    }


    alasanPulang =
      radio.value;

  }


  // ================================================
  // DATA MEMBER
  // ================================================

  if (!memberToken) {


    tampilkanError(

      "❌ Member Token tidak ditemukan."

    );


    return;

  }


  // ================================================
  // TOMBOL
  // ================================================

  const tombol =
    document
      .getElementById(
        "btnKonfirmasiPulang"
      );


  const tombolBatal =
    document
      .getElementById(
        "btnBatalPulang"
      );


  tombol.disabled =
    true;


  tombolBatal.disabled =
    true;


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "normal";


  hasil.innerHTML =

    "⏳ Menyimpan absensi pulang...";


  // ================================================
  // AMBIL GPS ULANG
  // ================================================

  if (
    !navigator.geolocation
  ) {


    tampilkanError(

      "❌ Browser tidak mendukung GPS."

    );


    tombol.disabled =
      false;


    tombolBatal.disabled =
      false;


    return;

  }


  navigator.geolocation.getCurrentPosition(

    async function(position) {


      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      try {


        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  aksi:
                    "absensiMember",

                  memberToken:
                    memberToken,

                  deviceId:
                    deviceId,

                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  alasanPulang:
                    alasanPulang,

                  hasilPulang:
                    hasilPulang

                })

            }
          );


        const result =
          await response.json();


        console.log(
          "HASIL PULANG:",
          result
        );


        // ==========================================
        // BERHASIL
        // ==========================================

        if (
          result &&
          result.sukses
        ) {


          formPulangSelesai();


          hasil.className =
            "success";


          hasil.innerHTML =

            "✅ <b>ABSEN PULANG BERHASIL</b>" +

            "<br><br>" +

            "Nama: " +

            (
              result.nama ||
              localStorage.getItem(
                "memberNama"
              )
            ) +

            "<br>" +

            "Waktu: " +

            (
              result.waktu ||
              "-"
            ) +

            "<br>" +

            "Total: " +

            (
              result.totalJam ||
              "-"
            ) +

            "<br>" +

            "Status: " +

            (
              result.status ||
              "-"
            ) +

            "<br><br>" +

            "Hasil: " +

            hasilPulang;


          if (pulangCepat) {


            hasil.innerHTML +=

              "<br>" +

              "Alasan: " +

              alasanPulang;

          }


          setTimeout(
            function() {

              location.reload();

            },
            6000
          );


        }


        // ==========================================
        // GAGAL
        // ==========================================

        else {


          hasil.className =
            "error";


          hasil.innerHTML =

            "❌ " +

            (
              result &&
              result.pesan
                ? result.pesan
                : "Absensi pulang gagal."
            );


          tombol.disabled =
            false;


          tombolBatal.disabled =
            false;

        }


      } catch(error) {


        console.error(
          "ERROR SIMPAN PULANG:",
          error
        );


        hasil.className =
          "error";


        hasil.innerHTML =

          "❌ Tidak dapat terhubung ke server absensi.";


        tombol.disabled =
          false;


        tombolBatal.disabled =
          false;

      }

    },


    function(error) {


      hasil.className =
        "error";


      if (
        error.code === 1
      ) {


        hasil.innerHTML =

          "❌ Izin GPS ditolak.";


      } else if (
        error.code === 2
      ) {


        hasil.innerHTML =

          "❌ Lokasi GPS tidak tersedia.";


      } else if (
        error.code === 3
      ) {


        hasil.innerHTML =

          "❌ Pengambilan GPS terlalu lama.";


      } else {


        hasil.innerHTML =

          "❌ GPS tidak dapat diperoleh.";

      }


      tombol.disabled =
        false;


      tombolBatal.disabled =
        false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


// ==================================================
// FORM PULANG SELESAI
// ==================================================

function formPulangSelesai() {


  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  sedangPulang =
    false;


}


// ==================================================
// BATAL PULANG
// ==================================================

function batalPulang() {


  document
    .getElementById(
      "formPulang"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "hasil"
    )
    .className =
    "normal";


  document
    .getElementById(
      "hasil"
    )
    .innerHTML =

    "ℹ️ Absensi pulang dibatalkan.";


  document
    .getElementById(
      "btnKonfirmasiPulang"
    )
    .disabled =
    false;


  document
    .getElementById(
      "btnBatalPulang"
    )
    .disabled =
    false;


  document
    .getElementById(
      "hasilPulang"
    )
    .value = "";


  document
    .querySelectorAll(
      'input[name="alasanPulang"]'
    )
    .forEach(
      function(radio) {

        radio.checked =
          false;

      }
    );


  sedangPulang =
    false;


  pulangCepat =
    false;


  // ================================================
  // IZINKAN SCAN ULANG
  // ================================================

  sudahScan =
    false;


  setTimeout(
    function() {

      mulaiScanner();

    },
    500
  );

}


// ==================================================
// TAMPILKAN ERROR
// ==================================================

function tampilkanError(
  pesan
) {


  const hasil =
    document
      .getElementById(
        "hasil"
      );


  hasil.className =
    "error";


  hasil.innerHTML =
    pesan;

}


// ==================================================
// SELESAI
// ==================================================

</script>

</html>
